server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
  location / { try_files $uri $uri/ =404; }
  location ~* \.(html|css|js|webmanifest)$ { expires -1; try_files $uri =404; }
  location ~* \.(jpg|jpeg|png|ico|svg)$ { expires 1h; try_files $uri =404; }
  location ~ /\. { deny all; }
}
